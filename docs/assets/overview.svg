<svg xmlns="http://www.w3.org/2000/svg" width="840" height="204" viewBox="0 0 840 204" role="img" aria-labelledby="title desc">
<title id="title">Track work alongside your code</title><desc id="desc">Agents use the CLI and humans use the dashboard to manage tasks, stored as repository-owned JSON files.</desc>
<style>
.box{fill:#fafafa;stroke:#d4d4d4} .label{fill:#171717;font:600 16px system-ui,sans-serif} .detail{fill:#525252;font:13px system-ui,sans-serif} .line{stroke:#a3a3a3;fill:none;stroke-width:1.5} .caption{fill:#737373;font:12px system-ui,sans-serif}
@media(prefers-color-scheme:dark){.box{fill:#171717;stroke:#404040} .label{fill:#f5f5f5} .detail{fill:#bdbdbd} .caption{fill:#a3a3a3}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#a3a3a3" stroke-width="1.5"/></marker></defs>

<rect class="box" x="16" y="32" width="228" height="112" rx="12"/>
<rect x="36" y="54" width="24" height="3" rx="1.5" fill="#6d9479"/>
