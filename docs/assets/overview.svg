<text class="detail" x="36" y="108">Agents and humans</text>
<text class="detail" x="36" y="128">One shared task workflow</text>
<rect class="box" x="306" y="32" width="228" height="112" rx="12"/>
<rect x="326" y="54" width="24" height="3" rx="1.5" fill="#6d9479"/>
<text class="label" x="326" y="84">Tasks + subtasks</text>
<text class="detail" x="326" y="108">Notes, todos, dependencies</text>
<text class="detail" x="326" y="128">Organize work at any depth</text>
<rect class="box" x="596" y="32" width="228" height="112" rx="12"/>
<rect x="616" y="54" width="24" height="3" rx="1.5" fill="#6d9479"/>
<text class="label" x="616" y="84">Your repository</text>
<text class="detail" x="616" y="108">.agent-work/</text>
<text class="detail" x="616" y="128">Local files, versioned in Git</text>
<path class="line" d="M254 88h42" marker-end="url(#arrow)"/>
<path class="line" d="M544 88h42" marker-end="url(#arrow)"/>
